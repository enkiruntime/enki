[package]
name = "enki-parsu"
version = "0.2.3"
edition = "2024"
authors = ["Enki Dev <enkiruntime@proton.me>"]
license = "MIT OR Apache-2.0"
description = "Hardware profiling and JIT compilation synthesis engine for Enki"
repository = "https://github.com/enkiruntime/enki"
keywords = ["vulkan", "jit", "compiler", "gpu", "enki"]
categories = ["compilers", "development-tools", "hardware-support"]
readme = "README.md"

exclude = [
    "src/compiler/**",
    "src/compiler",
]

[dependencies]
ash = "0.38"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8"
ureq = "2.10"
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
