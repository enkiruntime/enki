[package]
name = "girra"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust Differential Fuzzing and Verification Engine for Enki & Parsu"

[dependencies]
syn = { version = "2.0", features = ["full", "visit", "visit-mut", "extra-traits", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"

rand = "0.8"
rand_chacha = "0.3"

clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"

libloading = "0.8"
tempfile = "3.10"
rayon = "1.10"

float-cmp = "0.9"

enki = { path = "../.." }
