[package]
name = "enki_macros"
version = "0.2.0"
edition = "2024"
authors = ["Enki Dev <enkiruntime@proton.me>"]
license = "MIT OR Apache-2.0"
description = "Procedural macros for Enki GPU kernel"
repository = "https://github.com/enkiruntime/enki"
keywords = ["gpu", "proc-macro", "macros", "vulkan", "enki"]
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
